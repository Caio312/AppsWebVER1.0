<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Restrito — CS Engenharia</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:#0a1520;
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:1.5rem;
  }
  .card{
    background:#0f1e2d;
    border:1px solid rgba(200,169,110,.2);
    border-radius:10px;
    padding:clamp(2rem,5vw,3rem);
    width:100%;max-width:380px;
    text-align:center;
  }
  .logo-box{
    width:56px;height:56px;border-radius:8px;
    background:#0d1b2e;border:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 1.5rem;overflow:hidden;
  }
  .logo-box img{width:100%;height:100%;object-fit:contain;}
  h1{
    font-family:'Fraunces',Georgia,serif;font-weight:300;
    font-size:1.5rem;color:#f0ece4;margin-bottom:.4rem;
  }
  .sub{font-size:.82rem;color:rgba(255,255,255,.35);margin-bottom:2rem;}
  label{display:block;font-size:.75rem;color:rgba(200,169,110,.7);
        text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem;text-align:left;}
  input[type=password]{
    width:100%;padding:.75rem 1rem;font-size:1rem;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:4px;color:#f0ece4;
    outline:none;transition:border-color .2s;
  }
  input[type=password]:focus{border-color:rgba(200,169,110,.5);}
  .error{
    font-size:.8rem;color:#f87171;
    background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);
    border-radius:4px;padding:.6rem .9rem;margin-top:.9rem;text-align:left;
  }
  button{
    margin-top:1.25rem;width:100%;
    padding:.8rem;background:#c8a96e;color:#0d1b2a;
    border:none;border-radius:4px;font-size:.88rem;font-weight:500;
    cursor:pointer;transition:background .2s;letter-spacing:.03em;
  }
  button:hover{background:#e8c87e;}
  .back{display:block;margin-top:1.25rem;font-size:.78rem;color:rgba(255,255,255,.28);transition:color .2s;}
  .back:hover{color:rgba(200,169,110,.7);}
</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="logo-box">
    <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="CS Engenharia">
  </div>
  <h1>Área Restrita</h1>
  <p class="sub">Ferramentas exclusivas · CS Engenharia & Avaliações</p>

  <form method="POST">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="pwd">Senha de acesso</label>
    <input type="password" id="pwd" name="password" autofocus autocomplete="current-password" placeholder="••••••••">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <button type="submit">Entrar</button>
  </form>

  <a class="back" href="/">← Voltar ao site</a>
</div>
</body>
</html>
